<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>My CFN Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Quicksand:wght@500;700&display=swap">
<link rel="stylesheet" href="board.css">
<script src="config.js"></script>
</head>
<body>
<div class="wrap" style="max-width:640px">
  <header><div class="brand"><img src="https://changefn.com/logo.png" alt="" onerror="this.remove()"><div><h1>CFN · My page</h1><div class="date" id="hello"></div></div></div></header>
  <div id="error" class="err" hidden></div>
  <div class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr))">
    <div class="card"><p class="label">Today</p><div class="big num" id="today">-</div><div class="note">deals</div></div>
    <div class="card"><p class="label">This week</p><div class="big num" id="week">-</div><div class="note">deals</div></div>
    <div class="card"><p class="label">This month</p><div class="big num" id="month">-</div><div class="note">deals</div></div>
  </div>
  <section class="card" style="margin-bottom:14px">
    <p class="label">How you show on the team board</p>
    <form id="form">
      <label style="display:block;margin:6px 0"><input type="radio" name="mode" value="first"> First name (<span id="firstName"></span>)</label>
      <label style="display:block;margin:6px 0"><input type="radio" name="mode" value="full"> Full name (<span id="fullName"></span>)</label>
      <label style="display:block;margin:6px 0"><input type="radio" name="mode" value="nickname"> Nickname
        <input id="nick" maxlength="24" placeholder="The Closer" style="margin-left:6px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font:inherit"></label>
      <button type="submit" style="margin-top:10px;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer">Save</button>
      <span class="note" id="saved" style="margin-left:8px" aria-live="polite"></span>
    </form>
    <p class="note" style="margin-top:10px">The team board only ever shows your deal count. Never your pay, your debt, or client names.</p>
  </section>
  <section class="card"><p class="label">My recent deals (only you see this)</p><ul class="feed" id="recent"></ul></section>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const t = new URLSearchParams(location.hash.slice(1)).get("t");
  const showErr = (m) => { $("error").hidden = !m; $("error").textContent = m || ""; };
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  if (!t) { showErr("This page needs your private link. Ask a manager for it."); return; }
  function render(d) {
    $("hello").textContent = "Hi " + d.me.first_name + " · you show as " + d.me.shown_as;
    $("today").textContent = d.today; $("week").textContent = d.week; $("month").textContent = d.month;
    $("firstName").textContent = d.me.first_name; $("fullName").textContent = d.me.full_name || d.me.first_name;
    document.querySelector(`input[name=mode][value=${d.me.display_mode}]`).checked = true;
    if (d.me.nickname) $("nick").value = d.me.nickname;
    $("recent").innerHTML = d.recent.length ? d.recent.map((r) => `<li><span>${new Date(r.at).toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "America/New_York" })} · ${esc(r.status || "")}</span><span>$${Math.round((r.debt || 0) / 1000)}K</span></li>`).join("") : '<li class="empty">No deals yet. Your first one shows here.</li>';
  }
  async function call(body) {
    const r = await fetch(window.BOARD_API + "/me" + (body ? "" : "?t=" + encodeURIComponent(t)), body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ t, ...body }) } : {});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "Something went wrong");
    return j;
  }
  call().then(render).catch((e) => showErr(e.message));
  $("form").onsubmit = async (e) => {
    e.preventDefault();
    const mode = new FormData($("form")).get("mode");
    $("saved").textContent = "";
    if (mode === "nickname" && $("nick").value.trim().length < 2) { $("saved").textContent = "Type a nickname first."; return; }
    try { render(await call({ mode, nickname: $("nick").value })); $("saved").textContent = "Saved. The board updates in a few seconds."; }
    catch (err) { $("saved").textContent = err.message; }
  };
  $("nick").oninput = () => { document.querySelector("input[value=nickname]").checked = true; $("saved").textContent = ""; };
})();
</script>
</body>
</html>
